[package]
name = "flequit-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS abstraction layer for Flequit: paths, notifications, dialogs, lifecycle, capabilities."

[dependencies]
flequit-types.workspace = true

async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
dark-light.workspace = true
fontdb.workspace = true
directories.workspace = true
rfd.workspace = true
notify-rust.workspace = true
opener.workspace = true
trash.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

# Notification scheduling and the picker's oneshot channel are shared by every
# backend, so tokio is not desktop-only.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }

[target.'cfg(target_os = "ios")'.dependencies]
tokio = { workspace = true, features = ["rt", "time", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
