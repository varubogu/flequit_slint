# Dependabot version updates.
# Schedule: weekly, Monday 09:00 Asia/Tokyo.
#
# Cargo manifests live in three directories (workspace root, plus committed
# lockfiles under flequit-model and flequit-repository). One `directories`
# entry is the smallest update Dependabot allows for those paths. Minor and
# patch updates share one group. `group-by: dependency-name` is intentionally
# omitted: it opens one pull request per dependency name, which would split
# this bundle. Dependabot still raises that group once per directory.
#
# sea-orm and sea-orm-migration major bumps are one group so they land in the
# same pull request. Other majors stay individual.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/crates/flequit-model"
      - "/crates/flequit-repository"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # One entry now covers every cargo directory, so the limit is shared.
    # Leave room for the minor/patch group plus separate major pull requests.
    open-pull-requests-limit: 10
    groups:
      sea-orm-major:
        patterns:
          - "sea-orm"
          - "sea-orm-*"
        update-types:
          - "major"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Android Gradle project (build.gradle.kts, settings.gradle.kts).
  - package-ecosystem: "gradle"
    directory: "/mobile/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workflows under .github/workflows. Every Actions bump, including majors,
  # shares one group.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # rust-toolchain.toml (channel pin). Dependabot does not read mise.toml.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
