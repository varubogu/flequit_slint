name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Migrates the template database once; individual tests copy it.
      - name: Prepare fixtures
        shell: bash
        run: ./scripts/test-prepare.sh

      # -j 4 is mandatory: it bounds SQLite fixture contention and memory use.
      - name: Run tests
        run: cargo test -j 4 --workspace
