name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows only. macOS desktop builds are paused until a
        # preview is published (no macOS runner). Restore by adding
        # macos-latest back to this list.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p flequit-app

  # Cross-compilation only: these confirm that the whole application still
  # builds for mobile, not that it runs there. Device verification is manual
  # and tracked in plans/plan.md section 6.3.
  mobile:
    name: Mobile (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            runner: ubuntu-latest
            features: android
          # iOS is paused until a preview is published. The check needs a
          # macOS runner (Xcode / xcrun). Restore by uncommenting this entry
          # and the "Check the iOS application" step below.
          # - target: aarch64-apple-ios
          #   runner: macos-latest
          #   features: ios
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-deps
      - uses: dtolnay/rust-toolchain@stable
      # `targets:` on dtolnay/rust-toolchain@stable installs std for `stable`.
      # rust-toolchain.toml pins another release, and rustup stores that as a
      # separate toolchain, so cargo fails with `can't find crate for core`.
      - name: Install cross-compilation target
        run: |
          channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # Slint's Android backend compiles a Java helper during `cargo check`,
      # which needs android.jar and d8. ring needs the NDK clang. Neither is
      # configured by installing the Rust target alone.
      - name: Install Android SDK
        if: matrix.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build-tools
        if: matrix.target == 'aarch64-linux-android'
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Android NDK
        id: setup-ndk
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      # cargo-ndk points clang, ar and the linker at the NDK. The same wrapper
      # is what mobile/android uses to build.
      - if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk --locked

      - name: Check the platform layer
        run: cargo check --target ${{ matrix.target }} -p flequit-platform

      - name: Check the Android application
        if: matrix.target == 'aarch64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # cargo-ndk exports ANDROID_PLATFORM as the min API (26). Slint then
          # looks up platforms/android-26, but its Java helper needs the
          # compile SDK. ANDROID_JAR is consulted first.
          export ANDROID_JAR="${ANDROID_HOME}/platforms/android-35/android.jar"
          test -f "$ANDROID_JAR"
          cargo ndk --platform 26 --target arm64-v8a check -p flequit-app --features android

      # iOS application check. Paused with the matrix entry above.
      # - name: Check the iOS application
      #   if: matrix.target == 'aarch64-apple-ios'
      #   run: cargo check --target ${{ matrix.target }} -p flequit-app --features ${{ matrix.features }}

  # Web (wasm32) is paused until a preview is published. The browser build is
  # a UI shell on sample data (see web/README.md), not a shipped target.
  # Re-enable by uncommenting this job. Install the cross target on the
  # toolchain in rust-toolchain.toml; dtolnay/rust-toolchain's `targets:`
  # input attaches std to stable only.
  # web:
  #   name: Web (wasm32)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: ./.github/actions/setup-linux-deps
  #     - uses: dtolnay/rust-toolchain@stable
  #     - name: Install cross-compilation target
  #       run: |
  #         channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
  #         test -n "$channel"
  #         rustup toolchain install "$channel" --target wasm32-unknown-unknown
  #     - uses: Swatinem/rust-cache@v2
  #     - run: cargo build --release -p flequit-web --target wasm32-unknown-unknown --features wasm
