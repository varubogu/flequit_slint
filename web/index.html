<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flequit (web preview)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1b1f;
        /* Slint renders text itself; this only affects the fallback message. */
        font-family: system-ui, sans-serif;
        color: #e5e5ea;
      }

      /* Slint sizes its canvas from the element, so the element has to have a
         size of its own before the module starts. */
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="status">Loading…</div>

    <script type="module">
      import init from "./pkg/flequit_web.js";

      const status = document.getElementById("status");
      try {
        // `#[wasm_bindgen(start)]` runs as part of instantiation, so there is
        // nothing to call afterwards.
        await init();
        status.remove();
      } catch (error) {
        status.textContent = `Failed to start: ${error}`;
        throw error;
      }
    </script>
  </body>
</html>
