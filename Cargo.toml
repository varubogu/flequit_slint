[workspace]
resolver = "3"
members = [
    "crates/flequit-types",
    "crates/flequit-platform",
    "crates/flequit-model",
    "crates/flequit-repository",
    "crates/flequit-core",
    "crates/flequit-infrastructure-sqlite",
    "crates/flequit-infrastructure-automerge",
    "crates/flequit-infrastructure",
    "crates/flequit-settings",
    "crates/flequit-testing",
    "crates/flequit-ui",
    "crates/flequit-web",
    "crates/flequit-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/varubogu/flequit_slint"

[workspace.dependencies]
# Internal crates
flequit-types = { path = "crates/flequit-types" }
flequit-platform = { path = "crates/flequit-platform" }
flequit-model = { path = "crates/flequit-model" }
flequit-repository = { path = "crates/flequit-repository" }
flequit-core = { path = "crates/flequit-core" }
flequit-infrastructure = { path = "crates/flequit-infrastructure" }
flequit-infrastructure-sqlite = { path = "crates/flequit-infrastructure-sqlite" }
flequit-infrastructure-automerge = { path = "crates/flequit-infrastructure-automerge" }
flequit-settings = { path = "crates/flequit-settings" }
flequit-testing = { path = "crates/flequit-testing" }
flequit-ui = { path = "crates/flequit-ui" }
flequit-web = { path = "crates/flequit-web" }

# UI
# `unstable-winit-030` exposes the window-attributes hook that turns off the
# window transparency Slint requests by default (see `select_backend` in
# flequit-app). It is tied to Slint's minor version: recheck it when upgrading
# Slint. Enabled here rather than in flequit-app so that every crate resolves
# the same Slint features: otherwise `cargo test -p flequit-ui` builds its own
# copy of Slint and everything above it.
slint = { version = "1", features = ["unstable-winit-030"] }
slint-build = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

# Data
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# Search matching folds full-width and half-width forms (NFKC).
unicode-normalization = "0.1"

# Errors / logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "chrono"] }
tracing-appender = "0.2"

# Platform
# Mobile: the JNI / Swift bridges the flequit-platform backends talk to.
jni = "0.21"
ndk-context = "0.1"
# Web (stage 1: UI only).
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

dark-light = "3"
# Matches the version Slint's renderer already pulls in.
fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap", "std"] }
directories = "6"
rfd = "0.17"
notify-rust = "4"
opener = "0.8"
trash = "5"

# Dev
tempfile = "3"
mockall = "0.13"
rstest = "0.24"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
# Slint's generated code is large; keep incremental builds usable.
opt-level = 0
debug = 1

# Automerge is unusable unoptimised: with debug assertions on, every lookup also
# runs a linear scan of the whole document to cross-check the fast path, and
# its column storage lives in `hexane`. Saving 17 tasks took ~60 s this way and
# ~15 ms with both crates optimised. The assertions only check Automerge's own
# invariants, not ours.
[profile.dev.package.automerge]
opt-level = 3
debug-assertions = false

[profile.dev.package.hexane]
opt-level = 3
debug-assertions = false

# `yansi` is a dependency of a proc macro (ouroboros, under sea-orm) and, in
# test builds only, also of `pretty_assertions`. A crate built for both sides
# gets the regular dev profile, one built for proc macros alone gets the
# build-override profile, so its hash — and with it ouroboros, sea-orm and every
# flequit crate above them — differed between `cargo test` and `cargo run`, and
# `target/` held two copies of each. Pinning its debuginfo gives it the same
# profile either way.
[profile.dev.package.yansi]
debug = false
